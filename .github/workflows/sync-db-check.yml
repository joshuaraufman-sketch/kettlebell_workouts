name: sync-db check

on:
  pull_request:
    paths:
      - 'lib/knowledge/kettlebell-exercise-database.md'
      - 'lib/knowledge/kettlebell-exercise-database.ts'
      - 'scripts/sync-db.mjs'
  push:
    branches: [main]
    paths:
      - 'lib/knowledge/kettlebell-exercise-database.md'
      - 'lib/knowledge/kettlebell-exercise-database.ts'
      - 'scripts/sync-db.mjs'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-db.mjs --check
